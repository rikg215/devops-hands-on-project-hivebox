name: Hivebox-CI

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - uses: 3d3c42e5aac5ba805825da76410c181273ba90b1

      # installs uv and Python 3.13 on the runner
      - name: Set up uv
        uses: 07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.13"

      # installs everything from uv.lock (fastapi, httpx, pylint, pytest)
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint code with pylint
        run: uv run pylint $(git ls-files '*.py')

      - name: Lint Dockerfile with hadolint
        uses: 06be81baf89a55ffd0e24b8f04a4185738dd3387

      - name: Run unit tests
        run: uv run pytest -v

      # builds the image but keeps it on the runner instead of pushing it anywhere
      - name: Build Docker image
        uses: c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          load: true
          tags: hivebox:ci

      - name: Test /version endpoint
        run: |
            expected=$(uv run python -c "from app import VERSION; print(VERSION)")
            docker run -d -p 8000:8000 --name hivebox hivebox:ci
            result=$(curl -sSf --retry 5 --retry-all-errors --retry-delay 2 localhost:8000/version | jq -r '.version')
            if [ "$result" != "$expected" ]; then
              echo "Expected: $expected, got: $result"
              docker logs hivebox
              exit 1
            fi
              
            